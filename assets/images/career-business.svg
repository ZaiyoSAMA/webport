<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="growthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="bizShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#ec4899" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="24" fill="url(#bizBg)"/>
  <circle cx="510" cy="90" r="75" fill="#fbcfe8" opacity="0.4"/>
  <circle cx="90" cy="310" r="80" fill="#e9d5ff" opacity="0.5"/>

  <!-- Business Dashboard & Growth Chart -->
  <g transform="translate(100, 100)" filter="url(#bizShadow)">
    <!-- Dashboard Card -->
    <rect x="0" y="30" width="230" height="170" rx="16" fill="#ffffff"/>
    <rect x="0" y="30" width="230" height="35" rx="16" fill="#f3e8ff"/>
    <text x="20" y="52" fill="#7e22ce" font-family="sans-serif" font-weight="bold" font-size="12">Startup Growth &amp; Tech Biz</text>

    <!-- Bar Chart -->
    <rect x="25" y="140" width="22" height="40" rx="6" fill="#fbcfe8"/>
    <rect x="60" y="120" width="22" height="60" rx="6" fill="#f472b6"/>
    <rect x="95" y="100" width="22" height="80" rx="6" fill="#c084fc"/>
    <rect x="130" y="80" width="22" height="100" rx="6" fill="#a855f7"/>
    <rect x="165" y="65" width="22" height="115" rx="6" fill="#7e22ce"/>

    <!-- Upward Trend Line -->
    <path d="M 35 135 Q 95 90 176 60" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
    <circle cx="176" cy="60" r="6" fill="#ec4899"/>
  </g>

  <!-- Startup Rocket Launching -->
  <g transform="translate(350, 70)" filter="url(#bizShadow)">
    <!-- Exhaust Flame -->
    <path d="M 50 175 C 30 220 50 250 50 250 C 50 250 70 220 50 175 Z" fill="#fbbf24"/>
    <path d="M 50 180 C 40 210 50 230 50 230 C 50 230 60 210 50 180 Z" fill="#f43f5e"/>

    <!-- Rocket Body -->
    <path d="M 50 30 C 20 80 20 160 20 170 L 80 170 C 80 160 80 80 50 30 Z" fill="url(#rocketGrad)"/>
    <!-- Rocket Nose Tip -->
    <path d="M 50 30 C 35 60 25 80 25 90 L 75 90 C 75 80 65 60 50 30 Z" fill="#7e22ce"/>

    <!-- Porthole Window -->
    <circle cx="50" cy="110" r="14" fill="#ffffff"/>
    <circle cx="50" cy="110" r="10" fill="#38bdf8"/>
    <circle cx="47" cy="107" r="3" fill="#ffffff"/>

    <!-- Left Wing -->
    <path d="M 20 135 L -5 175 L 20 170 Z" fill="#7e22ce"/>
    <!-- Right Wing -->
    <path d="M 80 135 L 105 175 L 80 170 Z" fill="#7e22ce"/>

    <!-- Badge above rocket -->
    <rect x="-10" y="0" width="120" height="28" rx="8" fill="#10b981"/>
    <text x="5" y="18" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">🎯 Entrepreneur</text>
  </g>

  <!-- Floating Sparkles -->
  <g fill="#ec4899">
    <path d="M 120 70 q 8 0 8 -8 q 0 8 8 8 q -8 0 -8 8 q 0 -8 -8 -8 z"/>
    <path d="M 480 240 q 10 0 10 -10 q 0 10 10 10 q -10 0 -10 10 q 0 -10 -10 -10 z"/>
    <path d="M 280 60 q 6 0 6 -6 q 0 6 6 6 q -6 0 -6 6 q 0 -6 -6 -6 z"/>
  </g>
</svg>
