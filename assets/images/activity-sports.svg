<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSports" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#f5d0fe"/>
    </linearGradient>
    <linearGradient id="sportPinkPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softShadowSports" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="24" fill="url(#bgGradSports)"/>
  <circle cx="100" cy="90" r="70" fill="#fbcfe8" opacity="0.5"/>
  <circle cx="500" cy="300" r="80" fill="#e9d5ff" opacity="0.6"/>

  <!-- Motion Lines -->
  <path d="M 80 200 C 140 180 200 240 260 210" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.7"/>
  <path d="M 340 190 C 400 160 460 220 520 180" fill="none" stroke="#c084fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.7"/>

  <!-- Sports Ball & Fitness Composition -->
  <g transform="translate(160, 80)" filter="url(#softShadowSports)">
    <!-- Basketball / Sport Ball -->
    <circle cx="90" cy="120" r="60" fill="url(#sportPinkPurple)"/>
    <!-- Ball Lines -->
    <path d="M 30 120 C 60 120 120 120 150 120" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
    <path d="M 90 60 C 90 90 90 150 90 180" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
    <path d="M 45 78 C 75 90 75 150 45 162" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
    <path d="M 135 78 C 105 90 105 150 135 162" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
    <circle cx="65" cy="95" r="8" fill="#ffffff" opacity="0.3"/>

    <!-- Trophy / Medal beside ball -->
    <g transform="translate(130, 20)">
      <!-- Trophy Cup -->
      <path d="M 50 40 L 90 40 C 90 75 75 95 70 105 L 70 120 L 55 120 L 55 130 L 85 130 L 85 138 L 35 138 L 35 130 L 50 130 L 50 105 C 45 95 30 75 30 40 Z" fill="url(#trophyGrad)"/>
      <!-- Handles -->
      <path d="M 30 48 C 15 48 15 72 32 78" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
      <path d="M 90 48 C 105 48 105 72 88 78" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
      <!-- Star on trophy -->
      <path d="M 60 62 L 62 68 L 68 68 L 63 72 L 65 78 L 60 74 L 55 78 L 57 72 L 52 68 L 58 68 Z" fill="#ffffff"/>
    </g>

    <!-- Dumbbell / Fitness element -->
    <g transform="translate(18, 175)">
      <rect x="20" y="20" width="80" height="10" rx="5" fill="#a855f7"/>
      <rect x="10" y="10" width="14" height="30" rx="7" fill="#7e22ce"/>
      <rect x="0" y="14" width="12" height="22" rx="6" fill="#ec4899"/>
      <rect x="96" y="10" width="14" height="30" rx="7" fill="#7e22ce"/>
      <rect x="108" y="14" width="12" height="22" rx="6" fill="#ec4899"/>
    </g>
  </g>

  <!-- Sparkles & Stars -->
  <g fill="#ec4899">
    <path d="M 120 120 q 8 0 8 -8 q 0 8 8 8 q -8 0 -8 8 q 0 -8 -8 -8 z"/>
    <path d="M 460 110 q 10 0 10 -10 q 0 10 10 10 q -10 0 -10 10 q 0 -10 -10 -10 z"/>
    <path d="M 440 250 q 6 0 6 -6 q 0 6 6 6 q -6 0 -6 6 q 0 -6 -6 -6 z"/>
  </g>
</svg>
